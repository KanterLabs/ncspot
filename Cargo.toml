[package]
name = "resonance"
readme = "README.md"
version = "1.4.0"
default-run = "resonance"
description = "KanterLabs Resonance, a native terminal Spotify client built on ncspot and librespot."
exclude = ["images/**"]
keywords = ["spotify", "ncurses", "librespot", "terminal"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The public library crate follows the installed application's Resonance name.
[lib]
name = "resonance"
path = "src/lib.rs"

[[bin]]
name = "resonance"
path = "src/main.rs"

[[bin]]
name = "ncspot"
path = "src/legacy_main.rs"
test = false
bench = false

[badges]
maintenance = {status = "actively-developed"}

[workspace]
members = [
    ".",
    "xtask"
]

[workspace.package]
authors = ["KanterLabs contributors", "Henrik Friedrichsen <henrik@affekt.org>"]
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/KanterLabs/resonance"

[workspace.lints.clippy]
enum_glob_use = "warn"
use_self = "deny"
multiple_inherent_impl = "deny"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[profile.optimized]
inherits = "release"
lto = false
codegen-units = 16

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = "4.6.1"
arboard = {version = "3.6", optional = true}
crossbeam-channel = "0.5"
zbus = {version = "5.16.0", default-features = false, features = ["tokio"], optional = true}
fern = "0.7"
futures = "0.3"
image = {version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true}
ioctl-rs = {version = "0.2", optional = true}
libc = "0.2.186"
librespot-core = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = {version = "0.8.0", default-features = false, features = ["native-tls"]}
librespot-protocol = "0.8.0"
log = "0.4.32"
pancurses = {version = "0.17.0", optional = true}
parse_duration = "2.1.1"
platform-dirs = "0.3.0"
rand = "0.10"
regex = "1"
reqwest = {version = "0.13", features = ["blocking", "json"]}
serde = "1.0"
serde_cbor = "0.11.2"
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "net"]}
tokio-util = {version = "0.7.18", features = ["codec"]}
tokio-stream = {version = "0.1.18", features = ["sync"]}
toml = "1.1"
unicode-width = "0.2.2"
url = "2.5"
viuer = {version = "0.11", default-features = false, features = ["icy_sixel"], optional = true}

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[dependencies.rspotify]
default-features = false
features = ["client-ureq", "ureq-native-tls"]
version = "0.16.1"

[dependencies.cursive]
default-features = false
version = "0.21.1"

[dependencies.notify-rust]
default-features = false
version = "4"
# Use zbus, which we already depend on, instead of dbus.
features = ["z"]
optional = true

[features]
alsa_backend = ["librespot-playback/alsa-backend"]
album_art = ["image"] # Draw album art in the now playing view, with no terminal graphics protocol
cover = ["image", "ioctl-rs", "viuer"] # Support displaying the album cover
default = ["album_art", "share_clipboard", "pulseaudio_backend", "mpris", "notify", "crossterm_backend"]
mpris = ["zbus"] # Allow Resonance to be controlled via MPRIS API
ncurses_backend = ["cursive/ncurses-backend"]
notify = ["notify-rust"] # Show what's playing via a notification
crossterm_backend = ["cursive/crossterm-backend"]
pancurses_backend = ["cursive/pancurses-backend", "pancurses/win32"]
portaudio_backend = ["librespot-playback/portaudio-backend"]
pulseaudio_backend = ["librespot-playback/pulseaudio-backend"]
rodio_backend = ["librespot-playback/rodio-backend"]
share_clipboard = ["arboard", "arboard/wayland-data-control"] # Share a link to the system clipboard
share_selection = ["arboard", "arboard/wayland-data-control"] # Use the primary selection for sharing - linux and bsd only
termion_backend = ["cursive/termion-backend"]

[package.metadata.deb]
assets = [
  ["target/release/resonance", "usr/bin/", "755"],
  ["target/release/ncspot", "usr/bin/", "755"],
  ["prototype/opentui/dist/resonance-opentui", "usr/bin/", "755"],
  ["scripts/resonance-wezterm", "usr/bin/", "755"],
  ["scripts/resonance-update.sh", "usr/share/resonance/", "644"],
  ["scripts/ncspot-update.sh", "usr/share/resonance/", "644"],
  ["misc/resonance.desktop", "usr/share/applications/", "644"],
  ["images/resonance.svg", "usr/share/icons/hicolor/scalable/apps/resonance.svg", "644"],
  ["misc/resonance.1", "usr/share/man/man1/", "644"],
  ["misc/resonance.bash", "usr/share/bash-completion/completions/resonance", "644"],
  ["misc/_resonance", "usr/share/zsh/site-functions/", "644"],
  ["misc/resonance.fish", "usr/share/fish/vendor_completions.d/", "644"],
  ["prototype/opentui/dist/licenses/**/*", "usr/share/doc/resonance/licenses/", "644"],
  ["README.md", "usr/share/doc/resonance/README.md", "644"],
]
depends = "$auto"
extended-description = """\
KanterLabs Resonance is a native terminal Spotify client written in Rust using librespot. \
It is based on ncspot and remains heavily inspired by ncurses MPD clients, such as ncmpc."""
license-file = ["LICENSE"]
priority = "optional"
section = "sound"
