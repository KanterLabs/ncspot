name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TERM: xterm

jobs:
  # Build and test the x86_64 Linux target in a rootful container. The homelab
  # runner intentionally disallows sudo on the host.
  build-linux:
    name: Checking linux-x86_64
    runs-on: homelab-heavy
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Linux dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            libdbus-1-dev \
            libncursesw5-dev \
            libpulse-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            python3 \
            zstd
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        name: Cache build data
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rustup
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --target x86_64-unknown-linux-gnu -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt
      - name: Running cargo build
        run: cargo build --locked
      - name: Running cargo test
        run: cargo test --locked

  # Native ARM, macOS, and Windows jobs stay in this matrix because their
  # runner architecture or operating system is part of what they validate.
  build-native:
    name: Checking ${{ matrix.build_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The homelab runner pool is x86_64; retain a native hosted ARM runner for this target.
          - build_target: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ''
          - build_target: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            features: '--no-default-features --features rodio_backend,pancurses_backend'
          - build_target: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: '--no-default-features --features rodio_backend,pancurses_backend,share_clipboard,notify'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache build data
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rustup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --target ${{ matrix.target }} -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install portaudio pkg-config
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libpulse-dev libdbus-1-dev libncursesw5-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Running cargo build
        run: cargo build --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Running cargo test
        run: cargo test --locked --target ${{ matrix.target }} ${{ matrix.features }}

  # Check Rust code formatting.
  fmt:
    name: Running `cargo fmt`
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Install clippy + rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  # Run `cargo clippy` on all the targets in all workspace members with all
  # features enabled, and return an error if there are any clippy suggestions.
  clippy:
    name: Running `cargo clippy`
    container:
      image: ubuntu:24.04
    runs-on: homelab-heavy
    steps:
      - name: Install Linux dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            libasound2-dev \
            libdbus-1-dev \
            libncursesw5-dev \
            libpulse-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            portaudio19-dev \
            python3 \
            zstd
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        name: Cache build data
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rustup
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Install clippy + rustfmt
        run: rustup component add clippy
      - name: cargo clippy
        run: cargo clippy --locked --no-deps --workspace --all-targets --all-features --verbose -- -D warnings
