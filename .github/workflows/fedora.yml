name: Fedora

# Builds a Resonance binary against Fedora's own glibc and system libraries, which
# the generic linux-x86_64 release asset cannot be relied on to match. Runs on the
# KanterLabs homelab fleet: `homelab-heavy`, because this is a sustained Rust build.
#
# A binary built on Fedora N runs on N and newer, so build on the oldest Fedora
# release you still need to run on and bump `fedora_version` as those go EOL.
#
# Every push to main leaves a downloadable binary on the run, so the laptop
# never has to compile; tags additionally attach it to the release.
#
# Speed: Rust dependencies come from the cache, so the native build compiles only
# Resonance itself. Under the `release` profile's fat LTO and single codegen unit
# that one crate took about two and a half minutes, cached or not, so branch builds
# use the `optimized` profile (no LTO, parallel codegen) and only tags pay for
# `release`.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora release to build against"
        required: false
        default: "43"

env:
  CARGO_TERM_COLOR: always
  TERM: xterm
  # Full LTO for release assets; a fast parallel build for everything else.
  PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'optimized' }}

concurrency:
  group: fedora-${{ github.ref }}
  # A newer commit on main makes an in-flight build pointless; a tag build is
  # a release asset and always runs to the end.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Building for Fedora ${{ inputs.fedora_version || '43' }}
    runs-on: homelab-heavy
    permissions:
      contents: write
    container:
      image: registry.fedoraproject.org/fedora:${{ inputs.fedora_version || '43' }}
    steps:
      # Before checkout: the base image has no git, and actions/checkout would
      # otherwise fall back to a tarball with no repository metadata.
      - name: Install build dependencies
        run: |
          dnf --assumeyes --setopt=install_weak_deps=False install \
            binutils \
            ca-certificates \
            curl \
            dbus-devel \
            gcc \
            gcc-c++ \
            git \
            gzip \
            libxcb-devel \
            make \
            ncurses-devel \
            openssl-devel \
            pkgconf-pkg-config \
            pulseaudio-libs-devel \
            python3 \
            tar \
            unzip \
            xz \
            zstd

      - uses: actions/checkout@v7
        name: Checkout src

      # The checkout belongs to the runner's user while the container runs as
      # root, and git will not read a repository it thinks it does not own.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Install the pinned official baseline archive and verify its published
      # hash before building the standalone terminal frontend.
      - name: Install pinned Bun
        env:
          BUN_VERSION: 1.4.2
        run: |
          set -euo pipefail
          bun_dir="$HOME/.bun/bin"
          bun_archive="$(mktemp --suffix=.zip)"
          bun_checksums="$(mktemp)"
          bun_extract="$(mktemp -d)"
          mkdir -p "$bun_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip" \
            --output "$bun_archive"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/SHASUMS256.txt" \
            --output "$bun_checksums"
          awk -v archive="$bun_archive" \
            '$2 == "bun-linux-x64-baseline.zip" { print $1 "  " archive; found = 1 } END { exit !found }' \
            "$bun_checksums" | sha256sum --check --status
          unzip -q "$bun_archive" -d "$bun_extract"
          install -m 0755 "$bun_extract/bun-linux-x64-baseline/bun" "$bun_dir/bun"
          echo "$bun_dir" >> "$GITHUB_PATH"
          test "$("$bun_dir/bun" --version)" = "$BUN_VERSION"

      # Only rustc, cargo and the standard library. Left to itself, the first cargo
      # call would install every component rust-toolchain.toml lists for editors
      # (rustfmt, clippy, rust-analyzer), which a build never runs.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          "$HOME/.cargo/bin/rustup" toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # Keyed on the toolchain, the lockfile and the profile, and saved with
      # Resonance's own artifacts pruned, so what is restored is only dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fedora${{ inputs.fedora_version || '43' }}
          key: ${{ env.PROFILE }}

      - name: Resolve release name
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          fedora="${{ inputs.fedora_version || '43' }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=resonance-${version}-fedora${fedora}-x86_64" >> "$GITHUB_OUTPUT"

      - name: Running cargo build
        run: cargo build --profile "$PROFILE" --locked

      - name: Build OpenTUI prototype
        working-directory: prototype/opentui
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
          ./dist/resonance-opentui --smoke
          test -x dist/resonance-opentui

      - name: Stage OpenTUI executable
        run: |
          install -D -m 0755 \
            prototype/opentui/dist/resonance-opentui \
            "target/${PROFILE}/resonance-opentui"

      - name: Packaging assets
        working-directory: target/${{ env.PROFILE }}
        run: |
          asset="${{ steps.name.outputs.asset }}"
          strip resonance ncspot
          mkdir -p licenses/resonance licenses/opentui
          install -m 0644 "$GITHUB_WORKSPACE/LICENSE" licenses/resonance/LICENSE
          node_modules_dir="$GITHUB_WORKSPACE/prototype/opentui/node_modules"
          if [ -d "$node_modules_dir" ]; then
            while IFS= read -r notice; do
              relative="${notice#${node_modules_dir}/}"
              install -D -m 0644 "$notice" "licenses/opentui/$relative"
            done < <(
              find "$node_modules_dir" -type f \
                \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'patents*' \) \
                -print | sort
            )
          fi
          for notice in LICENSES.md THIRD_PARTY_LICENSES.md THIRD_PARTY_NOTICES.md; do
            if [ -f "$GITHUB_WORKSPACE/prototype/opentui/$notice" ]; then
              install -m 0644 "$GITHUB_WORKSPACE/prototype/opentui/$notice" "licenses/opentui/$notice"
            fi
          done
          tar czvf "${asset}.tar.gz" resonance ncspot resonance-opentui licenses
          sha256sum "${asset}.tar.gz" > "${asset}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.asset }}
          path: target/${{ env.PROFILE }}/${{ steps.name.outputs.asset }}.*
          if-no-files-found: error

      - name: Releasing assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/${{ env.PROFILE }}/${{ steps.name.outputs.asset }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
